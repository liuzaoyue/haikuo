window.addEventListener("beforeunload", (e) => {
    e.preventDefault();
    e.returnValue = '';
});
 const VideoDB = {
  dbName: "videoCacheDB",
  storeName: "videoFiles",
  db: null,
  // 初始化库
  init() {
    return new Promise((resolve, reject) => {
      // 版本号从1改成2，必须升版才能执行onupgradeneeded建表
      const req = indexedDB.open(this.dbName, 2);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        // 原有视频缓存仓库
        if (!db.objectStoreNames.contains(this.storeName)) {
          db.createObjectStore(this.storeName, { keyPath: "url" });
        }
        // 新增播放进度仓库，主键url，和读写方法对应
        if (!db.objectStoreNames.contains("progress")) {
          db.createObjectStore("progress", { keyPath: "url" });
        }
      };
      req.onsuccess = (e) => {
        this.db = e.target.result;
        resolve();
      };
      req.onerror = reject;
    })
  },
  // 读取单条缓存视频blob
  get(url) {
    return new Promise((resolve) => {
      if (!this.db) return resolve(null);
      const t = this.db.transaction(this.storeName, "readonly");
      const store = t.objectStore(this.storeName);
      const req = store.get(url);
      req.onsuccess = () => resolve(req.result?.blob || null);
    })
  },
  // 获取全部缓存列表
  getAllCache() {
    return new Promise((resolve, reject) => {
      if (!this.db) return resolve([]);
      const t = this.db.transaction(this.storeName, "readonly");
      const store = t.objectStore(this.storeName);
      const req = store.getAll();
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = reject;
    })
  },
  // 存入本地缓存
  save(url, blob, cover = "") {
    return new Promise((resolve, reject) => {
      if (!this.db) return resolve();
      const t = this.db.transaction(this.storeName, "readwrite");
      const store = t.objectStore(this.storeName);
      const req = store.put({ url, blob, cover, time: Date.now() });
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e);
    })
},
  // 清空全部缓存
  clear() {
     return new Promise((resolve, reject) => {
       if (!this.db) return resolve();
       const transaction = this.db.transaction(this.storeName, "readwrite");
       const store = transaction.objectStore(this.storeName);
       const clearReq = store.clear();
       transaction.oncomplete = () => {
         resolve();
       };
       transaction.onerror = (err) => reject(err.target.error);
     })
   },

  // ============ 新增播放进度相关方法 ============
  // 保存播放进度
  savePlayProgress(videoUrl, currentTime) {
    return new Promise((resolve) => {
      if (!this.db) return resolve();
      const t = this.db.transaction("progress", "readwrite");
      const store = t.objectStore("progress");
      store.put({
        url: videoUrl,
        time: currentTime,
        updateTime: Date.now()
      });
      resolve();
    });
  },
  // 获取视频上次播放进度
  getPlayProgress(videoUrl) {
    return new Promise((resolve) => {
      if (!this.db) return resolve(0);
      const t = this.db.transaction("progress", "readonly");
      const store = t.objectStore("progress");
      const req = store.get(videoUrl);
      req.onsuccess = () => {
        const record = req.result;
        // 存在记录且播放时长大于1秒才返回
        if (record && record.time > 1) {
          resolve(record.time);
        } else {
          resolve(0);
        }
      };
    });
  },
  // 播放完成清除进度
  clearPlayProgress(videoUrl) {
    return new Promise((resolve) => {
      if (!this.db) return resolve();
      const t = this.db.transaction("progress", "readwrite");
      const store = t.objectStore("progress");
      store.delete(videoUrl);
      resolve();
    });
  }
};

// 统一缓存历史回退工具，自带最大次数防护，不会退出页面
function rollbackCacheHistory(maxRoll = 30) {
    if (clearingHistory) return;
    clearingHistory = true;
    let rollCount = 0;

    function loopBack() {
        rollCount++;
        // 防护：后退超过30次直接终止，避免退出页面
        if (rollCount >= maxRoll) {
            clearingHistory = false;
            return;
        }
        const state = history.state;
        // 找到缓存锚点，收尾删除锚点
        if (state && state.cacheAnchor === true) {
            history.back();
            setTimeout(() => {
                clearingHistory = false;
            }, 200);
            return;
        }
        history.back();
        setTimeout(loopBack, 120);
    }
    loopBack();
}

// 下载缓存视频文件
// 下载IndexedDB内缓存的视频二进制，不走网络链接
 async function downloadCacheBlob(targetNetUrl) {    
    let tempBlobUrl = "";
    try {
        await VideoDB.init();
        const allCache = await VideoDB.getAllCache();
        const cacheItem = allCache.find(item => item.url === targetNetUrl);

        if (!cacheItem) {
            showTip("缓存数据不存在");
            return;
        }
        if (!cacheItem.blob) {
            showTip("缓存文件缺失，无法导出");
            return;
        }
        tempBlobUrl = URL.createObjectURL(cacheItem.blob);
        const aTag = document.createElement("a");
        aTag.href = tempBlobUrl;
        aTag.download = "缓存视频.mp4";
        document.body.appendChild(aTag);
        aTag.click();
        aTag.remove();
        showTip("本地缓存导出完成，不消耗流量");
    } catch (err) {
        log("缓存导出失败：" + err);
        showTip("导出失败");
    } finally {
        if(tempBlobUrl) {
            URL.revokeObjectURL(tempBlobUrl);
        }
    }
}

// 传入你拿到的lrc字符串，输出解析好的歌词列表
 // 全局歌词存储

let lyricData = [];
const lrcBox = document.querySelector(".lrc-box");
const lrcContent = document.querySelector(".lrc-content");

// LRC歌词解析
function parseLrc(raw) {
    const lines = raw.split("\n");
    const list = [];
    // 兼容2位/3位毫秒 .xx 或 .xxx
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

    lines.forEach(line => {
        const match = line.match(reg);
        if (!match) return;

        const minute = Number(match[1]);
        const second = Number(match[2]);
        const ms = Number(match[3]);
        const text = match[4].trim();

        // 跳过时间后完全空白的行，其余全部保留（作词、作曲、歌词都留下）
        if (text === "") return;

        const totalTime = minute * 60 + second + ms / Math.pow(10, match[3].length);
        list.push({ time: totalTime, text: text });
    })
    return list;
}

/**
 * 统一处理视频url：读取本地blob缓存、释放旧blob、赋值播放器
 */
async function preCacheOnly(sourceUrl, coverImg="") {    
     
      const localBlob = await VideoDB.get(sourceUrl);
      if (localBlob) {
          return true;
      }
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);
      try {
          const res = await fetch(sourceUrl, {
              cache: "default",
              signal: controller.signal
          });
          clearTimeout(timer);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          await VideoDB.save(sourceUrl, blob, coverImg);
          return true;
      } catch (err) {
          clearTimeout(timer);
          if(err.name === "AbortError"){
              log(`预缓存超时放弃：${sourceUrl}`);
          }else{
              const msg = err instanceof Error ? err.message : "非标准捕获异常";
              log(`预缓存失败 ${sourceUrl} | ${msg}`);
          }
          return false;
      }
  }
async function getCachedVideoPlayUrl(sourceUrl, autoSave = false) {
    let playUrl = sourceUrl;
    const localBlob = await VideoDB.get(sourceUrl);
    if (localBlob) {
        playUrl = URL.createObjectURL(localBlob);
    } else if(autoSave) {
        try {
            const res = await fetch(sourceUrl, { cache: "default" });
            const blob = await res.blob();
            const coverImg = window.videoCoverMap?.get(sourceUrl) || "";
            await VideoDB.save(sourceUrl, blob, coverImg);
            playUrl = URL.createObjectURL(blob);
        } catch (err) {
            log(`缓存失败: ${sourceUrl}` +err);
        }
    }
    revokeBlobUrl(videoPlayerDom);
    videoPlayerDom.src = playUrl;   
    return playUrl;
}

//检测MP4
function checkVideoUsable(videoUrl) {
    return new Promise((resolve) => {
        const tempVideo = document.createElement('video');
        tempVideo.style.display = 'none';
        document.body.appendChild(tempVideo);

        let timer = setTimeout(() => {
            tempVideo.remove();
            resolve(false);
        }, 3000);

        tempVideo.addEventListener('canplay', () => {
            clearTimeout(timer);
            tempVideo.remove();
            resolve(true);
        }, { once: true });

        tempVideo.addEventListener('error', () => {
            clearTimeout(timer);
            tempVideo.remove();
            resolve(false);
        }, { once: true });
        tempVideo.preload = "metadata"; // 仅加载视频信息，不预加载画面
        tempVideo.src = videoUrl;
        tempVideo.load();
    });
}

/**
 * 格式化秒数为 00:00
 */
function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

// 视频可播放后存入历史
function bindVideoHistoryListener(videoDom, url) {
     const onCanPlay = () => {
         saveVideoToHistory(url);
         clearListener();
     };
     const onErr = () => {
         clearListener();
     };
     function clearListener() {
         videoDom.removeEventListener("canplay", onCanPlay);
         videoDom.removeEventListener("error", onErr);
     }
     videoDom.addEventListener("canplay", onCanPlay);
     videoDom.addEventListener("error", onErr);
}

/**
 * 滑动角度计算工具
 */
function getSlideAngle(offsetX, offsetY) {
    return Math.atan2(offsetY, offsetX) * 180 / Math.PI;
}

/**
 * 判断滑动方向 1上滑(下一个) 2下滑(上一个) 3左 4右 0无滑动
 */
function getSlideDirection(startX, startY, endX, endY) {
    const offsetX = endX - startX;
    const offsetY = endY - startY;
    if (Math.abs(offsetX) < 70 && Math.abs(offsetY) < 70) return 0;
    const angle = getSlideAngle(offsetX, offsetY);
    if (angle >= -135 && angle <= -45) return 1;
    if (angle > 45 && angle < 135) return 2;
    if ((angle >= 135 && angle <= 180) || (angle >= -180 && angle < -135)) return 3;
    if (angle >= -45 && angle <= 45) return 4;
    return 0;
}

// 限制并发缓存
function runLimitCache(urlArr, maxParallel = 3) {
    if(!urlArr || urlArr.length === 0) return;
    let index = 0;
    async function nextTask() {
        if(index >= urlArr.length) return;
        const url = urlArr[index++];
        preCacheOnly(url).catch(err => log(`单条缓存异常 ${url}：` + err)).finally(() => nextTask());
    }
    for(let i = 0; i < maxParallel; i++) {
        nextTask().catch(err =>
         log("并发任务启动异常："+ err));
    }
}

// 全局增加锁变量（放到脚本最外层）


async function loadVideoFromList() {
    // 并发拦截锁，防止手动滑动+ended事件同时调用
    if (isVideoLoadingBusy) {
        log("loadVideoFromList 正在执行，忽略重复调用");
        return;
    }
    isVideoLoadingBusy = true;
    // 新增超时兜底，10秒强制解锁，防止死锁
    const safeUnlockTimer = setTimeout(()=>{
        isVideoLoadingBusy = false;
    },10000);
    try {
        if (isLocalCachePlay) {
            clearTimeout(safeUnlockTimer);
            isVideoLoadingBusy = false;
            return;
        }
        listIndex++;
        if (listIndex >= videoPlayList.length) {
            showTip('视频列表播放完毕，重新加载新视频');
            await loadAllSource();
            return;
        }

        const sourceUrl = videoPlayList[listIndex];
        let canPlay = true;
        // 判断当前播放这条是否已经预缓存
        const existCacheItem = allCacheList.find(item => item.url === sourceUrl);
        // ✅只有没有本地缓存的在线链接，才做网络可用性校验
        if (!existCacheItem) {
            canPlay = await checkVideoUsable(sourceUrl);
        }
        if (!canPlay) {
            log('❎文件损坏');
            clearTimeout(safeUnlockTimer);
            isVideoLoadingBusy = false;
            loadVideoFromList();
            return;
        }
        
        log(`正在播放第:${listIndex}个  总数：${videoPlayList.length}`);
        videoLoadErrorCount=0;
        const isDoumeiSource = /doumei/.test(reqApiUrl);
        if (isDoumeiSource) {
            videoPlayerDom.src = sourceUrl;         
            currentPlayOriginUrl = sourceUrl;
        }else {
            await getCachedVideoPlayUrl(sourceUrl, true);
            currentPlayOriginUrl = sourceUrl;
        }
        bindVideoHistoryListener(videoPlayerDom, sourceUrl);

        // 恢复播放进度
        const lastTime = await VideoDB.getPlayProgress(sourceUrl);
        if(lastTime > 1){
            videoPlayerDom.currentTime = lastTime;
            showTip(`恢复上次观看位置：${Math.floor(lastTime)}秒`);
        }

        // =========预缓存逻辑：失败尝试下下级，连续2次失败停止预缓存=========
        let preCacheFailCount = 0;
        let tryCacheIndex = listIndex + 1;
        while(preCacheFailCount < 2 && tryCacheIndex < videoPlayList.length)
        {
            const cacheUrl = videoPlayList[tryCacheIndex];
            if (!cacheUrl || !cacheUrl.trim()) {
                tryCacheIndex++;
                continue;
            }
            if(isDoumeiSource){       
             break;
            }
            const posterUrl = window.videoCoverMap?.get(cacheUrl) || "";
            const preOk = await preCacheOnly(cacheUrl, posterUrl);
            if(preOk){                
                break; //成功，结束预缓存试探
            }else{
                preCacheFailCount++;
                videoPlayList.splice(tryCacheIndex,1);
                // splice删除之后，后面数组前移，tryCacheIndex不要+1，继续测试当前下标（原来的下下条）
            }
        }
        if(preCacheFailCount >=2){
            log("⚠️连续两次预缓存失败，本集播放周期停止预缓存");
        }

    } catch (err) {
        log("loadVideoFromList异常：" + err);
    } finally {
        // ✅无论成功失败，必须释放锁！
        isVideoLoadingBusy = false;
    }
}

async function neteaseSearch(name) {
    if (!name) return null;

    let isPlaylistMode = false;
    let idVal = "";

    if (/id=/.test(name)) {
        idVal = name.replace(/.*?id=(\d+)/ ,'$1');
        isPlaylistMode = true;
    } else if (/^\d+$/.test(name.trim())) {
        idVal = name.trim();
        isPlaylistMode = true;
    }

    if(isPlaylistMode){
        // 主接口、备用接口分开写参数
        const playlistTryList = [
            {
                url:"https://meting.mikus.ink/api?server=netease&type=playlist&id="+encodeURIComponent(idVal)
            },
            {
                url:"https://api.injahow.cn/meting/?type=playlist&id="+encodeURIComponent(idVal)
            }
        ];

        for(let i=0; i<playlistTryList.length; i++){
            const tryUrl = playlistTryList[i].url;
            try {
                const res = await fetch(tryUrl, { method: "GET", credentials: "omit" });
                if(!res.ok) throw new Error("http status "+res.status);
                const list = await res.json();
                if (Array.isArray(list) && list.length > 0) {
                    return list;
                }
            } catch (err) {
                log("neteaseSearch歌单 接口异常：" + err.message);
            }
        }
        log("neteaseSearch歌单：全部接口失败");
        return null;
    }else{
        // 歌名关键词搜索，只使用主接口，备用不支持search
        const url = "https://meting.mikus.ink/api?server=netease&type=search&id=" + encodeURIComponent(name);
        try {
            const res = await fetch(url, { method: "GET", credentials: "omit" });
            const list = await res.json();
            if (!Array.isArray(list) || list.length === 0) {
                return null;
            }
            return list;
        } catch (err) {
            log("neteaseSearch歌名搜索 请求异常：" + err.message);
            return null;
        }
    }
}

     // ----下面是其余4个音乐源正常逻辑----

    const rect = progressBox.getBoundingClientRect();
    const touch = e.touches[0];
    const tx = touch.clientX;
    const ty = touch.clientY;
    // 触摸点在进度条内，直接终止，不记录滑动起点
    if (tx >= rect.left && tx <= rect.right && ty >= rect.top && ty <= rect.bottom) {
        return;
    }

    touchStartX = e.touches[0].pageX;
    touchStartY = e.touches[0].pageY;
}, false);
