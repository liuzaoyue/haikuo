//校验MP4
function checkVideoUsable(videoUrl) {
    return new Promise((resolve) => {
        const tempVideo = document.createElement('video');
        tempVideo.style.display = 'none';
        document.body.appendChild(tempVideo);

        let timer = setTimeout(() => {
            tempVideo.remove();
            resolve(false);
        }, 3000);

        tempVideo.addEventListener('canplay', () => {
            clearTimeout(timer);
            tempVideo.remove();
            resolve(true);
        }, { once: true });

        tempVideo.addEventListener('error', () => {
            clearTimeout(timer);
            tempVideo.remove();
            resolve(false);
        }, { once: true });
        tempVideo.preload = "metadata";
        tempVideo.src = videoUrl;
        tempVideo.load();
    });
}
//分批校验MP4
async function batchFilter(rawList, batchSize = 6) {
  const res = [];
  for (let i = 0; i < rawList.length; i += batchSize) {
    const slice = rawList.slice(i, i + batchSize);
    const tasks = slice.map(it => checkVideoUsable(it.videoUrl));
    const states = await Promise.all(tasks);
    slice.forEach((item, idx) => {
      if (states[idx]) res.push(item);
    })
  }
  return res;
}

function formatTime(s) {
    if (isNaN(s) || !isFinite(s)) return "00:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2, '0') + ":" + String(sec).padStart(2, '0');
}

        }
    }  
    return url;

function initVideoList(list, isAppend = false){

            existUrls.add(v.src);
        });

        if(isAppend && existUrls.has(item.videoUrl)) return false;

        urlSet.add(item.videoUrl);

async function loadJsonListSource(isInitLoad) {       
    if(nextPages !== null){
        nowPages = nextPages;
        nextPages = null;
    }
    let fetchUrl = reqApiUrl;
    const isNeedRandomPage = fetchUrl.includes("coop");
    if(isNeedRandomPage){
        fetchUrl = fetchUrl + nowPages;
    }
    try {
        const fetchRes = await fetch(fetchUrl);
        const resData = await fetchRes.json();
        if(isNeedRandomPage){
            const totalPage = resData.content?.totalPage;        
            if (totalPage && typeof totalPage === "number" && totalPage > 0) {
                let randomPage;
                do {
                    randomPage = Math.floor(Math.random() * totalPage) + 1;
                } while (randomPage === nowPages);
                nextPages = randomPage;
            } else {
                log("coop源无法获取有效totalPage，暂不更新nextPage");
            }
        }
        let videoDataArr = resData.list || resData.data || [];
        if (isNeedRandomPage) {
            videoDataArr = resData.content?.list || []
        }         
       
        const batchNewList=[];
        for(let item of videoDataArr){            
             const sourceUrl = item.video_url || item.content || item.playurl;
             if(!sourceUrl) continue;
             const tempItem={
                 videoUrl: sourceUrl,
                 cover: item.cover || "",
                 title: item.title || ""
             };
             batchNewList.push(tempItem);
        }

        // 仅在当前函数内部判断：doumei直接放行，其余源走批量校验
        let finalList;
        if (/doumei/.test(reqApiUrl)) {
            finalList = batchNewList;
        } else {
            finalList = await batchFilter(batchNewList);
        }

        // 首次全局洗牌裁剪
        if (isInitLoad && finalList.length >= 90) {
            log(`数据量${finalList.length}过大，随机抽取20条`);
            const tempArr = [...finalList];
            for (let i = tempArr.length - 1; i > 0; i--) {
                const r = Math.floor(Math.random() * (i + 1));
                [tempArr[i], tempArr[r]] = [tempArr[r], tempArr[i]];
            }
            finalList.splice(20);
        }
        // 增量单次条数限额
        const oneBatchMax=20;
        if(!isInitLoad && finalList.length>oneBatchMax) finalList.length=oneBatchMax;

        // 合并分支：入库+渲染同处一个if/else
        if(isInitLoad){
            videoPlayList = finalList;
            initVideoList(videoPlayList,false);
        }else{
            videoPlayList.push(...finalList);
            initVideoList(finalList,true);
        }
        log("有效视频总数：" + videoPlayList.length);
    } catch (error) {
        showTip("列表接口加载失败");
        log("loadJsonList异常：" + error);
    }
}

async function loadDjSource(isInitLoad) {   
    try {

        const htmlText = await fetchRes.text();

        const parser = new DOMParser();
        const listDoc = parser.parseFromString(htmlText, "text/html");
        const liItems = listDoc.querySelectorAll('li.qui_list__item');
        
        const taskList = [];
        for (const li of liItems) {
            const path = li.getAttribute("data-url");
            if (!path) continue;
            const detailUrl = new URL(path, reqApiUrl).href;
            const imgDom = li.querySelector('img.qui_list__img');
            const coverSrc = imgDom?.getAttribute('src') || "";

            const task = async () => {
                try {
                    const detailResp = await fetch(detailUrl);
                    const detailHtml = await detailResp.text();
                    const detailDoc = parser.parseFromString(detailHtml, "text/html");
                    const videoDom = detailDoc.querySelector('#audiodiv');
                    const realVideoUrl = videoDom?.getAttribute('src');
                    if (!realVideoUrl) return null;

                    const exists = videoPlayList.some(item => item.videoUrl === realVideoUrl);
                    if(exists) return null;

                    let finalCover = "";                    
                    if(!finalCover && coverSrc){
                        finalCover = coverSrc;
                    }

                    return {
                        videoUrl: realVideoUrl,
                        cover: finalCover,
                        title: ""
                    };
                } catch (err) {
                    log("DJ详情页解析失败 " + detailUrl + " " + err.message);
                    return null;
                }
            };
            taskList.push(task());
        }
        const results = await Promise.all(taskList);
 // 第一步：过滤解析成功、去重后的原始条目
 const parsedItems = results.filter(x => x !== null);
 // 第二步：批量可用性校验，生成最终合格条目
 const newItems = await batchFilter(parsedItems);
 // 全局数组合并
 if(isInitLoad){
    videoPlayList = newItems;
    initVideoList(videoPlayList, false);
}else{
    videoPlayList.push(...newItems);
    initVideoList(newItems, true);
}
    } catch (error) {
        showTip("DJ接口加载失败，2秒重试");
        log("DJ加载异常：" + error);
        if (!isSourceLoading) setTimeout(()=>loadDjSource(isInitLoad), 2000);
    } 
}

// LRC歌词解析
function parseLrc(raw) {
    const lines = raw.split("\n");
    const list = [];
    // 兼容2位/3位毫秒 .xx 或 .xxx
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;

    lines.forEach(line => {
        const match = line.match(reg);
        if (!match) return;

        const minute = Number(match[1]);
        const second = Number(match[2]);
        const ms = Number(match[3]);
        const text = match[4].trim();

        // 跳过时间后完全空白的行，其余全部保留（作词、作曲、歌词都留下）
        if (text === "") return;

        const totalTime = minute * 60 + second + ms / Math.pow(10, match[3].length);
        list.push({ time: totalTime, text: text });
    })
    return list;
}

function clearLyric(){

}

// 函数新增下标参数 slideIndex
function renderLyric(lrcRaw, slideIndex = 0){
  clearLyric();
  if(!lrcRaw || lrcRaw.trim() === ""){
    log('【renderLyric】歌词为空，直接结束');
    return;
  }
  const lrcContent = document.getElementById("lrcContent");
  log('【renderLyric】lrcContent DOM是否找到：' + !!lrcContent);
  if(!lrcContent) {
    log('【renderLyric】找不到#lrcContent容器，终止渲染！');
    return;
  }

  const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g;
  const lyricArr = [];
  let match;
  while((match = reg.exec(lrcRaw)) !== null){
    const min = Number(match[1]);
    const sec = Number(match[2]);
    const ms = Number(match[3]);
    const text = match[4].trim();
    if(!text) continue;
    const totalSec = min * 60 + sec + ms / (match[3].length===3 ? 1000 : 100);
    lyricArr.push({time:totalSec, text});
  }
  log('【renderLyric】解析出有效歌词行数：' + lyricArr.length);
  if(lyricArr.length === 0){
    log('【renderLyric】正则没匹配到标准时间戳歌词');
    return;
  }

  lyricArr.forEach(item=>{
    const lineDom = document.createElement("div");
    lineDom.className = "lrc-line";
    lineDom.dataset.time = item.time;
    lineDom.innerText = item.text;
    lrcContent.appendChild(lineDom);
  });

  // 删掉 if(slideIndex !== undefined) 分支，直接按下标取值
  const targetVideo = document.querySelector(`.swiper-slide video[data-index="${slideIndex}"]`);
  log('【renderLyric】传入下标：'+slideIndex+'，播放器是否找到：' + !!targetVideo);
  if(!targetVideo) return;

  // 全局清空所有视频旧监听，防止多视频同时触发歌词滚动
  document.querySelectorAll(".swiper-slide video").forEach(v => v.ontimeupdate = null);
  // 只为当前下标对应的视频绑定监听
  targetVideo.ontimeupdate = function(){
    const now = targetVideo.currentTime;
    const lines = lrcContent.querySelectorAll(".lrc-line");
    let activeIndex = 0;
    for(let i=0;i<lyricArr.length;i++){
      if(now >= lyricArr[i].time) activeIndex = i;
    }
    lines.forEach((dom,i)=>{
      dom.classList.toggle("active", i===activeIndex);
    });
    const lineHeight = 32;
    lrcContent.style.transform = `translateY(${80 - activeIndex * lineHeight}px)`;
  };
  log('【renderLyric】下标'+ slideIndex +'播放器监听绑定完成');
}

// 连播/单曲切换
 btnPlayMode.addEventListener("click", function () {
     const video = getCurrentVideo();
     if (!video) return;
     playAutoMode = !playAutoMode;
     this.innerText = playAutoMode ? "连播" : "循环";
     if (typeof showTip === "function") {
         showTip(playAutoMode ? "已开启连续播放" : "已开启单曲循环");
     }
     // 删除暂停判断：无论暂停还是播放，点击按钮都开始播放
     video.play().catch(err => console.log("模式切换后播放失败：", err));
 });

btnFitMode.addEventListener("click", function () {
     const video = getCurrentVideo();
     if (!video) return;
     if (this.innerText === "原始") {
         this.innerText = "满屏";
         globalFitMode = "contain";
         if (typeof showTip === "function") showTip("切换为原始比例");
     } else {
         this.innerText = "原始";
         globalFitMode = "cover";
         if (typeof showTip === "function") showTip("切换为满屏裁剪");
     }
     // 立刻对当前视频生效
     video.style.objectFit = globalFitMode;
     // 若你希望切比例也自动播放，取消下面注释即可
     video.play().catch(err => console.log("比例切换后播放失败：", err));
 });
